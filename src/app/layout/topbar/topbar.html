<div class="topbar">
  <div class="logo">
    <span class="logo-mark" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="2" y="2" width="12" height="12" rx="2" fill="#ffffff" fill-opacity="0.001" />
        <path d="M4 5h8M4 8h8M4 11h5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
      </svg>
    </span>
    <span class="logo-text">Interview Prep</span>
  </div>

  <div class="search">
    <mat-form-field appearance="fill" subscriptSizing="dynamic" class="search-field">
      <mat-icon matPrefix>search</mat-icon>
      <input matInput type="text" placeholder="Search questions…" />
    </mat-form-field>
  </div>

  <div class="actions">
    <button
      type="button"
      class="icon-btn"
      (click)="toggleTheme()"
      [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    >
      <mat-icon>{{ themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>

    <button type="button" class="avatar-btn" [matMenuTriggerFor]="avatarMenu" aria-label="Account menu">
      <span class="avatar-chip">{{ userService.initials() }}</span>
    </button>
    <mat-menu #avatarMenu="matMenu">
      <button mat-menu-item (click)="goToProfile()">Profile</button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="logOut()">Log out</button>
    </mat-menu>
  </div>
</div>
