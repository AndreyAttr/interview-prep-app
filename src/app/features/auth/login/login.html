<div class="login-page">
  <div class="login-wrap">
    <div class="login-header">
      <div class="login-logo">
        <span class="logo-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect x="2" y="2" width="12" height="12" rx="2" fill="#ffffff" fill-opacity="0.001" />
            <path d="M4 5h8M4 8h8M4 11h5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
          </svg>
        </span>
        <span class="logo-text">Interview Prep</span>
      </div>
      <div class="login-tagline">AI-powered technical interview preparation</div>
    </div>

    <div class="login-card">
      <h1>Sign in</h1>
      <p class="login-subtext">Enter your credentials to continue</p>

      @if (error()) {
        <div class="login-error">{{ error() }}</div>
      }

      <label class="field-label" for="login-email">Email</label>
      <input
        id="login-email"
        type="email"
        class="field-input"
        placeholder="you@example.com"
        [value]="email()"
        (input)="email.set($any($event.target).value)"
        (keydown)="onKeyDown($event)"
      />

      <label class="field-label" for="login-password">Password</label>
      <input
        id="login-password"
        type="password"
        class="field-input"
        placeholder="••••••••"
        [value]="password()"
        (input)="password.set($any($event.target).value)"
        (keydown)="onKeyDown($event)"
      />

      <button type="button" class="signin-btn" (click)="signIn()">Sign in</button>

      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-text">or continue with</span>
        <span class="divider-line"></span>
      </div>

      <div class="oauth-row">
        <button type="button" class="oauth-btn" (click)="signInWithGoogle()">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          Google
        </button>
        <button type="button" class="oauth-btn" (click)="signInWithMicrosoft()">
          <svg width="16" height="16" viewBox="0 0 23 23" aria-hidden="true">
            <rect x="1" y="1" width="10" height="10" fill="#f25022" />
            <rect x="12" y="1" width="10" height="10" fill="#7fba00" />
            <rect x="1" y="12" width="10" height="10" fill="#00a4ef" />
            <rect x="12" y="12" width="10" height="10" fill="#ffb900" />
          </svg>
          Microsoft
        </button>
      </div>
    </div>
  </div>
</div>
