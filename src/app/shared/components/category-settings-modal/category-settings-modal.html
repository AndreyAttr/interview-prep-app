<div class="modal-backdrop" (click)="onCancel()">
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div>
        <div class="modal-title">Category Settings</div>
        <div class="modal-subtitle">{{ category().name }}</div>
      </div>
      <button type="button" class="close-btn" aria-label="Close" (click)="onCancel()">✕</button>
    </div>

    <div class="modal-body">
      <div class="field">
        <label class="field-label" for="questionsPerTest">Questions per test</label>
        <input
          id="questionsPerTest"
          type="number"
          min="1"
          max="100"
          class="number-input"
          [value]="effectiveQuestionsPerTest()"
          (input)="questionsPerTest.set(+$any($event.target).value)"
        />
      </div>

      <div class="field">
        <span class="field-label">Question source</span>
        <div class="source-chips">
          @for (option of sourceOptions; track option.value) {
            <button
              type="button"
              class="source-chip"
              [class.selected]="effectiveQuestionSource() === option.value"
              (click)="selectSource(option.value)"
            >
              {{ option.label }}
            </button>
          }
        </div>
      </div>

      @if (effectiveQuestionSource() === 'mix') {
        <div class="field">
          <span class="field-label">Source mix</span>
          <app-weighted-sliders
            [labels]="['AI', 'Database', 'Manual']"
            [values]="effectiveSourceWeights()"
            (valuesChange)="sourceWeights.set($any($event))"
          ></app-weighted-sliders>
        </div>
      }

      <div class="field">
        <span class="field-label">Difficulty mix</span>
        <app-weighted-sliders
          [labels]="['Easy', 'Medium', 'Hard']"
          [values]="effectiveDifficultyMix()"
          (valuesChange)="difficultyMix.set($any($event))"
        ></app-weighted-sliders>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-cancel" (click)="onCancel()">Cancel</button>
      <button type="button" class="btn btn-save" (click)="onSave()">Save</button>
    </div>
  </div>
</div>
